name: CI

on:
  push:
    branches: [main, personal-telegram-ai]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build · typecheck · unit tests · API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Secret scan (no tokens/keys committed)
        run: |
          if grep -rEn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=tests \
              '([0-9]{8,10}:AA[A-Za-z0-9_-]{30,})|(sk-ant-[A-Za-z0-9_-]{20,})|(sk-proj-[A-Za-z0-9_-]{20,})|(eyJ[A-Za-z0-9_-]{20,}\.eyJ[A-Za-z0-9_-]{20,}\.)' . ; then
            echo "::error::Possible secret found in repository"; exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env$'; then echo "::error::.env is committed"; exit 1; fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - run: npm ls --depth=0
      - name: Typecheck (strict, src + tests)
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Official API contract (vs @grammyjs/types)
        run: npx tsx --test tests/integration/api-contract.int.test.ts
      - name: Build
        run: npm run build
      - name: Smoke start without config (must fail fast with a clear message)
        run: |
          set +e; out=$(node dist/index.js 2>&1); code=$?; set -e
          echo "$out"; test $code -eq 1; echo "$out" | grep -q "BOT_TOKEN kiritilmagan"
      - name: Production dependency audit (report only)
        run: npm audit --omit=dev || true
      - name: Print lockfile (for committing)
        if: hashFiles('package-lock.json') != '' && github.event_name == 'push'
        run: echo "-----BEGIN LOCK-----"; base64 -w0 package-lock.json; echo; echo "-----END LOCK-----"

  integration:
    name: integration (real Redis/BullMQ, Postgres RLS, ffmpeg/sharp)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: ffprobe + psql for verification
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg postgresql-client >/dev/null
      - name: ffmpeg-static (production binary) has libx265
        run: |
          BIN=$(node -e "import('ffmpeg-static').then(m=>console.log(m.default))")
          echo "ffmpeg-static: $BIN"; "$BIN" -hide_banner -version | head -1
          "$BIN" -hide_banner -encoders | grep -E "libx265"
      - name: Integration tests
        env:
          REDIS_URL: redis://localhost:6379
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: npm run test:integration
