name: CI

on:
  push:
    branches: [main, personal-telegram-ai]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan (no tokens/keys committed)
        run: |
          if grep -rEn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=tests \
              '([0-9]{8,10}:AA[A-Za-z0-9_-]{30,})|(sk-ant-[A-Za-z0-9_-]{20,})|(sk-proj-[A-Za-z0-9_-]{20,})|(eyJ[A-Za-z0-9_-]{20,}\.eyJ[A-Za-z0-9_-]{20,}\.)' . ; then
            echo "::error::Possible secret found in repository"; exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env$'; then echo "::error::.env is committed"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Installed dependency versions
        run: npm ls --depth=0

      - name: Official Bot API docs for methods used (from @grammyjs/types)
        run: >
          node scripts/print-api-docs.mjs postStory editStory deleteStory InputStoryContentPhoto InputStoryContentVideo
          deleteMessage deleteMessages deleteBusinessMessages getBusinessConnection BusinessConnection BusinessBotRights
          getFile sendPhoto ChatMemberAdministrator InlineKeyboardButton CopyTextButton getChatMember Story > api-docs.txt; cat api-docs.txt

      - uses: actions/upload-artifact@v4
        with:
          name: audit
          path: |
            package-lock.json
            api-docs.txt
